      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username, role]
              properties:
                name:
                  type: string
                username:
                  type: string
                role:
                  type: string
                  enum: [admin, teacher, student]
                password:
                  type: string
                  format: password
                province:
                  type: string
                  description: Built-in province code (case-insensitive) or Chinese name.
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [identity]
      operationId: updateUser
      summary: Update user profile, role, or province
      description: >-
        Role changes and cross-staff edits follow the privilege matrix
        (teachers may only manage student accounts).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username]
              properties:
                name:
                  type: string
                username:
                  type: string
                role:
                  type: string
                  enum: [admin, teacher, student]
                  description: Omit to keep the current role.
                province:
                  type: string
                  description: Built-in province code or Chinese name; unchanged value keeps the current one.
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/batch-province:
    post:
      tags: [identity]
      operationId: batchSetProvince
      summary: Set province for many users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, province]
              properties:
                userIds:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                province:
                  type: string
      responses:
        "200":
          description: Number of users updated (transaction is all-or-nothing).
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/csp-tickets:
    post:
      tags: [identity]
      operationId: assignCSPTickets
      summary: Assign CSP admission tickets
      description: >-
        Tickets follow `PROVINCE-GROUP<zero-padded number>` (e.g. HA-J00001).
        Sequence continues per (province, group). Provide exactly one of
        `createCount` (create candidate accounts) or `userIds` (existing users).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [province, group]
              properties:
                province:
                  type: string
                group:
                  type: string
                  enum: [J, S]
                numberLength:
                  type: integer
                  minimum: 3
                  maximum: 8
                  default: 5
                createCount:
                  type: integer
                  minimum: 1
                  maximum: 500
                userIds:
                  type: array
                  maxItems: 500
                  items:
                    type: string
                password:
                  type: string
                  format: password
                  description: Optional unified initial password for newly created accounts only.
      responses:
        "201":
          description: Ticket assignments in issue order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/CSPTicketAssignment"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/import:
    post:
      tags: [identity]
      operationId: importUsers
      summary: Import users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv:
                  type: string
      responses:
        "200":
          description: Import summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/export:
    get:
      tags: [identity]
      operationId: exportUsers
      summary: Export users
      responses:
        "200":
          description: UTF-8 CSV without passwords.
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags: [identity]
      operationId: resetUserPassword
      summary: Reset user password
      requestBody:
        $ref: "#/components/requestBodies/AdminPasswordChange"
      responses:
        "200":
          description: Password reset.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/provinces:
    get:
      tags: [identity]
      operationId: listProvinces
      summary: List built-in provinces with user counts
      responses:
        "200":
          description: Provinces in canonical sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProvinceView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/provinces/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [identity]
      operationId: setProvinceEnabled
      summary: Enable or disable a province
      description: Admin-only exam policy; disabled provinces block new assignments but keep existing users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated province view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvinceView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/groups:
    get:
      tags: [identity]
      operationId: listGroups
      summary: List groups
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [identity]
      operationId: createGroup
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/groups/{gid}/members:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    post:
      tags: [identity]
      operationId: addGroupMember
      summary: Add group member
      requestBody:
        $ref: "#/components/requestBodies/GroupMember"
      responses:
        "200":
          description: Member added.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [identity]
      operationId: removeGroupMember
      summary: Remove group member
      requestBody:
        $ref: "#/components/requestBodies/GroupMember"
      responses:
        "200":
          description: Member removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/events/ticket:
    post:
      tags: [realtime]
      operationId: issueStreamTicket
      summary: Issue stream ticket
      parameters:
        - name: contestId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Short-lived HttpOnly ticket cookie issued.
          headers:
            Set-Cookie:
              description: Contest-scoped `forge_stream` grant valid for one exam day.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/events:
    get:
      tags: [realtime]
      operationId: eventStream
      summary: Open event stream
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: contestId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events stream with named contest events.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: forge_session
    cookieAuth:
      type: apiKey
      in: cookie
      name: forge_stream
  parameters:
    ContestID:
      name: cid
      in: path
      required: true
      schema:
        type: string
    ProblemID:
      name: pid
      in: path
      required: true
      schema:
        type: string
    FileName:
      name: name
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ParticipantID:
      name: uid
      in: path
      required: true
      schema:
        type: string
    SubmissionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    GroupID:
      name: gid
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    OwnPasswordChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [oldPassword, newPassword]
            properties:
              oldPassword:
                type: string
                format: password
              newPassword:
                type: string
                format: password
                minLength: 10
    AdminPasswordChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password:
                type: string
                format: password
                minLength: 10
    GroupMember:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [userId]
            properties:
              userId:
                type: string
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient role, access, or exam grant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many authentication attempts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          description: Per-dependency readiness state.
        time:
          type: string
          format: date-time
    AuthSession:
      type: object
      required: [userId, username, name, role]
      properties:
        userId:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, teacher, student]
    User:
      type: object
      required: [id, username, name, role]
      properties:
        id:
          type: string
        username:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, teacher, student]
        province:
          type: string
          description: Built-in province code (e.g. HA); empty when unset.
        examTicket:
          type: string
          description: Assigned CSP admission ticket (e.g. HA-J00001); empty when unassigned.
        groups:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    ProvinceView:
      type: object
      required: [code, name, sort, enabled, users]
      properties:
        code:
          type: string
          description: Two-letter province code used in CSP tickets.
        name:
          type: string
        sort:
          type: integer
        enabled:
          type: boolean
        users:
          type: integer
          description: Number of users linked to this province.
        hasUsers:
          type: boolean
    CSPTicketAssignment:
      type: object
      required: [user, ticket]
      properties:
        user:
          $ref: "#/components/schemas/User"
        ticket:
          type: string
          example: HA-J00001
    Group:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        userIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Contest:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, running, finished]
        rankingMode:
          type: string
          enum: [oi, acm]
        allowedLanguages:
          type: array
          items:
            type: string
        problemIds:
          type: array
          items:
            type: string
        groupIds:
          type: array
          items:
            type: string
        participantUserIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        bindIpEnabled:
          type: boolean
        windowEnabled:
          type: boolean
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        notice:
          type: string
        zipProtected:
          type: boolean
        zipUnlocked:
          type: boolean
    Problem:
      type: object
      required: [id, contestId, code, title, statement, input, output, constraints]
      properties:
        id:
          type: string
        contestId:
          type: string
        code:
          type: string
        title:
          type: string
        statement:
          type: string
        input:
          type: string
        output:
          type: string
        examples:
          type: string
        constraints:
          type: string
        locale:
          type: string
        timeLimitMs:
          type: integer
        memoryLimitMib:
          type: integer
        taskType:
          type: string
          enum: [traditional, answers_only, interaction, choice]
        ioMode:
          type: string
          enum: [stdio, file]
        compareMode:
          type: string
        checkerLang:
          type: string
        checkerCode:
          type: string
          description: Teacher-only.
        interactorLang:
          type: string
        interactorCode:
          type: string
          description: Teacher-only.
        choiceQuestions:
          type: array
          items:
            $ref: "#/components/schemas/ChoiceQuestion"
        testCases:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
        locales:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    ChoiceQuestion:
      type: object
      required: [id, type, stem, score]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [single, multiple, judge]
        stem:
          type: string
        options:
          type: array
          items:
            type: string
        answer:
          description: Answer key; null in student-facing problem responses.
          oneOf:
            - type: string
              nullable: true
            - type: array
              nullable: true
              items:
                type: string
        score:
          type: integer
        explanation:
          type: string
    TestCase:
      type: object
      required: [id, inputFile, outputFile, score, subtask]
      properties:
        id:
          type: string
        inputFile:
          type: string
        outputFile:
          type: string
        score:
          type: integer
        subtask:
          type: integer
        timeLimitMs:
          type: integer
        memoryMib:
          type: integer
        dependsOn:
          type: array
          items:
            type: integer
    TestFileInventory:
      type: object
      required: [files, missingPairs, answerOnly]
      properties:
        files:
          type: array
          items:
            type: string
        missingPairs:
          type: array
          items:
            type: string
        answerOnly:
          type: boolean
    CaseResult:
      type: object
      required: [caseIndex, verdict, score]
      properties:
        caseIndex:
          type: integer
        verdict:
          type: string
        score:
          type: integer
        timeMs:
          type: integer
        memoryKib:
          type: integer
        cpuMs:
          type: integer
        message:
          type: string
    Submission:
      type: object
      required: [id, contestId, problemID, userId, language, verdict, score, submittedAt]
      properties:
        id:
          type: string
        contestId:
          type: string
        problemID:
          type: string
        userId:
          type: string
        userName:
          type: string
        language:
          type: string
        code:
          type: string
        verdict:
          type: string
        score:
          type: integer
        compileMessage:
          type: string
        cases:
          type: array
          items:
            $ref: "#/components/schemas/CaseResult"
        submittedAt:
          type: string
          format: date-time
        judgedAt:
          type: string
          format: date-time
    OIRankEntry:
      type: object
      required: [userId, userName, score, accepted]
      properties:
        userId:
          type: string
        userName:
          type: string
        score:
          type: integer
        accepted:
          type: integer
        problemScores:
          type: object
          additionalProperties:
            type: integer
    ACMRankEntry:
      type: object
      required: [userId, userName, solved, penaltyMin]
      properties:
        userId:
          type: string
        userName:
          type: string
        solved:
          type: integer
        penaltyMin:
          type: integer
    ContestStatistics:
      type: object
      required: [contestId, users, submissions, problems]
      properties:
        contestId:
          type: string
        users:
          type: integer
        submissions:
          type: integer
        problems:
          type: array
          items:
            type: object
            properties:
              problemId:
                type: string
              code:
                type: string
              title:
                type: string
              submissions:
                type: integer
              accepted:
                type: integer
              acceptRate:
                type: number
              bestScore:
                type: integer
              firstACUser:
                type: string
    BroadcastMessage:
      type: object
      required: [id, contestId, senderName, title, content, level, createdAt]
      properties:
        id:
          type: string
        contestId:
          type: string
        senderName:
          type: string
        targetUserId:
          type: string
        title:
          type: string
        content:
          type: string
        level:
          type: string
          enum: [info, warning, urgent]
        createdAt:
          type: string
          format: date-time
    ContestBundle:
      type: object
      required: [contest, problems]
      properties:
        contest:
          $ref: "#/components/schemas/Contest"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
