openapi: 3.0.3
info:
  title: Forge Contest API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://github.com/yviscool/forge
  description: |
    Forge v1 HTTP contract. The API is pre-launch and intentionally has no
    backward-compatibility guarantee. All business endpoints are under
    `/api/v1`; `/healthz`, `/readyz` and the SPA entry points are operational
    endpoints outside that prefix.
servers:
  - url: /
tags:
  - name: operational
    description: Health probes, clock synchronization, dictionaries, and SPA entry points.
  - name: auth
    description: Browser session lifecycle, password changes, and account identity.
  - name: contests
    description: Contest setup, lifecycle, exports, access control, and exam operations.
  - name: problems
    description: Problem authoring, test-data inventory, validation, and print exports.
  - name: submissions
    description: Candidate submissions, judge result ingestion, and rejudging.
  - name: identity
    description: User, group, credential, and CSV provisioning operations.
  - name: realtime
    description: Authenticated Server-Sent Events and targeted broadcast messages.
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /healthz:
    get:
      tags: [operational]
      operationId: health
      summary: Process health
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          description: Method not allowed.
  /readyz:
    get:
      tags: [operational]
      operationId: readiness
      summary: Persistence readiness
      security: []
      responses:
        "200":
          description: All configured operational dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one operational dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          description: Method not allowed.
  /app:
    get:
      tags: [operational]
      operationId: appEntry
      summary: Application entry
      security: []
      responses:
        "200":
          description: SPA entry redirect.
        "404":
          description: SPA bundle is unavailable.
  /teacher:
    get:
      tags: [operational]
      operationId: teacherEntry
      summary: Teacher console entry
      security: []
      responses:
        "200":
          description: SPA teacher entry.
        "404":
          description: SPA bundle is unavailable.
  /api/v1/time:
    get:
      tags: [operational]
      operationId: serverTime
      summary: Server clock
      security: []
      responses:
        "200":
          description: Current server time.
          content:
            application/json:
              schema:
                type: object
                required: [serverTime]
                properties:
                  serverTime:
                    type: string
                    format: date-time
        "405":
          description: Method not allowed.
  /api/v1/i18n:
    get:
      tags: [operational]
      operationId: dictionaries
      summary: UI dictionaries
      security: []
      responses:
        "200":
          description: Localized dictionary payload.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "405":
          description: Method not allowed.
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              anyOf:
                - required: [login]
                - required: [username]
              properties:
                login:
                  type: string
                  description: Username or an unambiguous display name.
                username:
                  type: string
                  deprecated: true
                  description: Compatibility alias for `login`.
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: |
            Session created. Browsers receive an HttpOnly, SameSite=Strict
            `forge_session` cookie scoped to `/api/v1`. Long-lived bearer
            credentials are never exposed in the browser login response body.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie for browser clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      responses:
        "200":
          description: Session revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: currentUser
      summary: Current user
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Change own password
      requestBody:
        $ref: "#/components/requestBodies/OwnPasswordChange"
      responses:
        "200":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/contests:
    get:
      tags: [contests]
      operationId: listContests
      summary: List contests
      responses:
        "200":
          description: Contests visible to the current user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [contests]
      operationId: createContest
      summary: Create contest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                rankingMode:
                  type: string
                  enum: [oi, acm]
                allowedLanguages:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Contest created as draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/import:
    post:
      tags: [contests]
      operationId: importContestBundle
      summary: Import contest bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContestBundle"
      responses:
        "201":
          description: Imported contest with fresh IDs and no cross-deployment participant bindings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: getContest
      summary: Get contest
      responses:
        "200":
          description: Contest detail. Sensitive operational fields are redacted for students.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/contests/{cid}/start:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    post:
      tags: [contests]
      operationId: startContest
      summary: Start contest
      responses:
        "200":
          description: Contest passed launch preflight and is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/finish:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    post:
      tags: [contests]
      operationId: finishContest
      summary: Finish contest
      responses:
        "200":
          description: Contest finished and final ranking frozen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/settings:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    put:
      tags: [contests]
      operationId: updateContestSettings
      summary: Update contest settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rankingMode:
                  type: string
                  enum: [oi, acm]
                allowedLanguages:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated contest settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/bundle:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: exportContestBundle
      summary: Export contest bundle
      responses:
        "200":
          description: Portable contest bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestBundle"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/ranking:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: getRanking
      summary: Get ranking
      responses:
        "200":
          description: OI or ACM ranking depending on contest settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - $ref: "#/components/schemas/OIRankEntry"
                    - $ref: "#/components/schemas/ACMRankEntry"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/statistics:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: contestStatistics
      summary: Contest statistics
      responses:
        "200":
          description: Per-problem statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContestStatistics"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/statistics/export:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: exportStatistics
      summary: Export statistics
      responses:
        "200":
          description: UTF-8 CSV report.
          content:
            text/csv:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [problems]
      operationId: listProblems
      summary: List problems
      responses:
        "200":
          description: Problems with judge material redacted for students.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [problems]
      operationId: createProblem
      summary: Create problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Problem"
      responses:
        "201":
          description: Problem created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/reorder:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    put:
      tags: [problems]
      operationId: reorderProblems
      summary: Reorder problems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemIds]
              properties:
                problemIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Reordered problems.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    get:
      tags: [problems]
      operationId: getProblem
      summary: Get problem
      responses:
        "200":
          description: Problem detail with sensitive material redacted for students.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [problems]
      operationId: updateProblem
      summary: Update problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Problem"
      responses:
        "200":
          description: Updated problem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [problems]
      operationId: deleteProblem
      summary: Delete problem
      responses:
        "200":
          description: Problem deleted and detached from contest order.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/contests/{cid}/problems/{pid}/validate:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    post:
      tags: [problems]
      operationId: validateProblem
      summary: Validate problem
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                  error:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/rejudge:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    post:
      tags: [submissions]
      operationId: rejudgeProblem
      summary: Rejudge problem
      responses:
        "202":
          description: |
            Matching submissions are durably marked queued for re-evaluation.
            The response reports total matches and immediate enqueue count;
            transient queue exhaustion is repaired by the background
            reconciler.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/subtasks:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    put:
      tags: [problems]
      operationId: configureSubtasks
      summary: Configure subtasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subtasks]
              properties:
                subtasks:
                  type: array
                  items:
                    type: object
                    required: [subtask, score]
                    properties:
                      subtask:
                        type: integer
                      score:
                        type: integer
                      timeLimitMs:
                        type: integer
                      memoryMib:
                        type: integer
                      dependsOn:
                        type: array
                        items:
                          type: integer
      responses:
        "200":
          description: Problem test cases with configured subtasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/files:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    get:
      tags: [problems]
      operationId: listTestFiles
      summary: List test files
      responses:
        "200":
          description: Test-data inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestFileInventory"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/files/sync:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    post:
      tags: [problems]
      operationId: syncTestFiles
      summary: Synchronize test files
      responses:
        "200":
          description: Test cases generated from paired files or answer key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/files/{name}:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
      - $ref: "#/components/parameters/FileName"
    get:
      tags: [problems]
      operationId: downloadTestFile
      summary: Download test file
      responses:
        "200":
          description: Test-data file.
          content:
            text/plain:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [problems]
      operationId: uploadTestFile
      summary: Upload test file
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: File stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [problems]
      operationId: deleteTestFile
      summary: Delete test file
      responses:
        "200":
          description: File removed.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/export:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    get:
      tags: [problems]
      operationId: exportProblemHTML
      summary: Export problem HTML
      responses:
        "200":
          description: CCF print-ready HTML.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/problems/{pid}/pdf:
    parameters:
      - $ref: "#/components/parameters/ContestID"
      - $ref: "#/components/parameters/ProblemID"
    get:
      tags: [problems]
      operationId: exportProblemPDF
      summary: Export problem PDF
      responses:
        "200":
          description: CCF A4 PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: No browser/PDF engine available.
  /api/v1/contests/{cid}/export:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: exportContestHTML
      summary: Export contest HTML
      responses:
        "200":
          description: Print-ready full contest HTML.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/pdf:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: exportContestPDF
      summary: Export contest PDF
      responses:
        "200":
          description: Full contest PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: No browser/PDF engine available.
  /api/v1/contests/{cid}/submissions:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [submissions]
      operationId: listSubmissions
      summary: List submissions
      description: |
        Returns the newest submissions first. Students receive only their own
        attempts. The feed is bounded to protect browser and server memory.
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of recent submissions to return (default 200, maximum 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Submission feed. Source and compile details are redacted for peers.
          headers:
            X-Result-Limit:
              description: Effective per-request result cap.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Create submission
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Stable retry key for this user and contest. Repeating the same key
            with the same payload returns the original submission.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[!-~]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [problemID, code]
              properties:
                problemID:
                  type: string
                language:
                  type: string
                code:
                  type: string
                  maxLength: 65536
                userId:
                  type: string
                  description: Teachers may set this; students are always bound to their session user.
      responses:
        "202":
          description: |
            Submission durably accepted or instantly graded. A queued
            submission remains accepted even when worker capacity is currently
            exhausted; the server reconciles it automatically. Replayed
            requests include `Idempotent-Replay: true` and retry dispatch when
            the original submission is still queued.
          headers:
            Idempotent-Replay:
              description: Present and true when the original submission is returned.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The idempotency key was already used with a different payload.
  /api/v1/contests/{cid}/groups:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    post:
      tags: [contests]
      operationId: bindGroup
      summary: Bind participant group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId:
                  type: string
      responses:
        "200":
          description: Group bound.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/participants:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    post:
      tags: [contests]
      operationId: bindParticipant
      summary: Bind participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: Participant bound.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/contests/{cid}/ip-bindings:
    parameters:
      - $ref: "#/components/parameters/ContestID"
    get:
      tags: [contests]
      operationId: getIPBindings
      summary: Get IP bindings
      responses:
        "200":
          description: IP binding state and per-user addresses.
          content:
            application/json:
              schema:
                type: object
                properties:
