  /api/v1/users:
    get:
      tags: [identity]
      operationId: listUsers
      summary: List users
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [identity]
      operationId: createUser
