name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: go-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l internal cmd)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: cross-compile (linux/darwin guard for platform files)
        shell: bash
        run: |
          GOOS=linux go build ./...
          GOOS=darwin go build ./...
      - name: test
        run: go test ./...
      - name: race (fast packages)
        run: go test -race ./internal/domain/ ./internal/app/ ./internal/auth/ ./internal/realtime/ ./internal/adapters/store/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build:only
        working-directory: frontend
      - name: dist produced
        shell: bash
        run: test -f internal/web/dist/index.html
