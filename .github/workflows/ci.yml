name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go-${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: judge doctor (toolchain facts for fixture debugging)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 纯诊断步骤,绝不失败:par.exe 的 4 线程总 CPU 恰好在 --cpu=3
          # 边界附近,繁忙 runner 上会被 RLIMIT_CPU 硬墙 SIGKILL(137),
          # 这本身就是有价值的观测输出,用 || echo 吞掉退出码。
          g++ --version | head -1
          which prlimit && prlimit --version | head -1 || echo "NO prlimit"
          command -v bwrap && bwrap --version || echo "NO bwrap"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo "no userns restriction sysctl"
          nproc; free -m | head -2
          g++ -O2 -std=c++14 -o /tmp/par.exe internal/judge/testdata/csp-day1/solutions/parallel.cpp
          echo "--- direct run:"; /tmp/par.exe || echo "exit=$?"
          if command -v prlimit >/dev/null; then echo "--- under prlimit:"; prlimit --as=536870912 --cpu=3 --nproc=64 -- /tmp/par.exe || echo "exit=$? (137=SIGKILL by the hard CPU wall: expected under load)"; fi
          echo "--- runner-exact replication (pipe stdin + scrubbed env + tempdir):"
          mkdir -p /tmp/rt && cd /tmp/rt
          echo -n "" | env -i PATH="$PATH" prlimit --as=536870912 --cpu=3 --nproc=64 -- /tmp/par.exe || echo "exit=$? (137=SIGKILL by the hard CPU wall: expected under load)"
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l internal cmd)"
      - name: vet
        run: go vet ./...
      - name: module verification
        run: go mod verify
      - name: build
        run: go build ./...
      - name: cross-compile (linux/darwin guard for platform files)
        shell: bash
        run: |
          GOOS=linux go build ./...
          GOOS=darwin go build ./...
      - name: cross-vet (type-check build-tagged test files on every OS)
        shell: bash
        run: |
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...
      - name: test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS:激活动理核探测(sysctl)/ulimit 降级墙/rusage 峰值等
            # darwin 路径;clang 编译 bits 头过慢,重 corpus 留在 linux/windows。
            go test ./internal/domain/ ./internal/config/ ./internal/app/ ./internal/auth/ ./internal/realtime/ ./internal/adapters/store/... ./internal/transport/... ./internal/observability/ ./internal/i18n/ ./internal/pdf/ ./internal/platform/...
            go test ./internal/judge/ -run 'TestDefaultWorkers|TestJudgeOneVerdictMapping|TestJudgeOneCompileError|TestSubtaskMapsEmpty|TestResolveIO|TestSafeFileName|TestPool|TestBuildRequest|TestCompileCache|TestFuzz|TestPerCaseLimits|TestCompareVerdict|TestNormalizeComparison|TestToolchainConfig|TestDarwinClangCorpus'
          else
            go test ./...
          fi
      - name: backup script tests
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/backup_test.sh
      - name: race (fast packages)
        run: go test -race ./internal/domain/ ./internal/app/ ./internal/auth/ ./internal/realtime/ ./internal/adapters/store/...
      - name: race (judge concurrency subset; heavy corpus excluded for time)
        run: go test -race ./internal/judge/ -run 'TestPool|TestCache|TestBuildRequest|TestSubtask|TestCompileCache|TestPerProblemRatio|TestDefaultWorkers|TestJudgeOneVerdict|TestInteraction|TestSpecialJudge|TestFuzz'

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pin npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0 --activate
      - run: npm ci
        working-directory: frontend
      - name: typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: lint
        run: npm run lint
        working-directory: frontend
      - name: unit tests
        run: npm run test:coverage
        working-directory: frontend
      - name: production dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run build:only
        working-directory: frontend
      - name: dist produced
        shell: bash
        run: test -f internal/web/dist/index.html

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: pin npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0 --activate
      - name: install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: install Playwright browsers
        # Playwright CDN / apt 镜像偶发长时间挂起（曾整段吃满 25min 作业
        # 超时，连续两轮卡死在同一步）：每个浏览器独立安装、单次尝试
        # 3min 硬超时、各重试一次——挂起被杀掉后重试，不拖垮整批。
        working-directory: frontend
        run: |
          for browser in chromium firefox webkit; do
            ok=0
            for attempt in 1 2; do
              if timeout 180 npx playwright install --with-deps "$browser"; then ok=1; break; fi
              echo "::warning::$browser install attempt $attempt failed/hung, retrying"
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "::error::$browser install failed twice"; exit 1; }
          done
      - name: browser acceptance
        run: npm run test:e2e
        working-directory: frontend
      - name: upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.67.1 lint api/openapi.yaml --format=stylish

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
